<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>JENESIS — Professional Business Accounting & Management Software</title>
    <script>
      /*
       * Theme bootstrap: runs before the first paint so the saved theme is
       * already applied and the interface never flashes the wrong colours.
       * Kept in sync with src/theme.mjs (tests/theme.test.js executes it).
       *
       * Each application remembers its own theme: the key is
       * jenesis_theme:<app>, with the old single-key jenesys_theme value as a
       * fallback so nobody loses the setting they chose before the split.
       */
      (function () {
        try {
          var appId = '';
          try {
            if (window.genesisDesktop && window.genesisDesktop.app) {
              appId = window.genesisDesktop.app;
            }
            if (!appId && typeof location !== 'undefined' && location.search) {
              var match = /[?&]app=([a-z]+)/.exec(location.search);
              if (match) appId = match[1];
            }
            if (!appId) appId = localStorage.getItem('jenesis_app') || '';
          } catch (appErr) { /* no application hint: the launcher is used */ }
          if (appId !== 'seller' && appId !== 'maintenance' && appId !== 'admin') appId = '';

          var pref = appId ? localStorage.getItem('jenesis_theme:' + appId) : null;
          if (pref !== 'light' && pref !== 'dark' && pref !== 'system') {
            pref = localStorage.getItem('jenesis_theme');
          }
          if (pref !== 'light' && pref !== 'dark' && pref !== 'system') {
            pref = 'light';
          }
          var dark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (dark) {
            root.classList.add('dark');
          }
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
          root.style.colorScheme = dark ? 'dark' : 'light';
          if (appId) {
            root.setAttribute('data-app', appId);
            // The right icon before the first paint as well.
            var icon = document.head && document.querySelector && document.querySelector('link[rel="icon"]');
            if (icon) icon.setAttribute('href', '/favicon-' + appId + '.png');
          }
        } catch (err) {
          /* storage unavailable: Light Mode is used */
        }
      })();
    </script>
  </head>
  <body class="bg-canvas text-ink overflow-x-hidden antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
