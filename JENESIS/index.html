<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>JENESIS — Professional Business Accounting &amp; Management Software</title>
    <!--
      boot.js paints the saved theme before the first frame and keeps a visible
      "Starting JENESIS…" card on screen until the interface takes over. It is a
      separate file, not an inline script, because the production
      Content-Security-Policy allows scripts from this origin only
      (server/security.js) — an inline script would be blocked and could not
      protect the start-up at all. See public/boot.js.
    -->
    <script src="/boot.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </head>
  <body class="bg-canvas text-ink overflow-x-hidden antialiased">
    <div id="root">
      <!--
        Shown until the interface mounts, and replaced by it. It carries its own
        inline styles so it is visible even when the stylesheet has not loaded
        yet: an empty screen is never the first thing a user sees.
      -->
      <div
        id="jenesis-boot"
        style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Segoe UI,system-ui,-apple-system,sans-serif;background:#f1f5f9;color:#0f172a;padding:32px"
      >
        <div style="text-align:center">
          <div style="font-size:20px;font-weight:700;letter-spacing:.08em">JENESIS</div>
          <div id="jenesis-boot-message" style="margin-top:8px;font-size:13px;color:#475569">
            Starting JENESIS…
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
