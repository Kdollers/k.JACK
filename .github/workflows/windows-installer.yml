name: JENESIS Windows installer

# Builds and verifies the JENESIS desktop installer for Windows.
#
# Job 1 (tests) runs the whole suite on Linux on every push.
# Job 2 (installer) produces release/JEN <version> Setup.exe on Windows,
# verifies the packaged folder and smoke-tests the INSTALLED application
# (install -> launch -> first-run setup -> sign-in -> accounting entry ->
# backup -> close -> relaunch -> data still there -> uninstall keeps data).
#
# The application source lives in the JENESIS/ folder of this repository. If you
# move JENESIS/ into its own repository, move this .github folder with it:
# GitHub only reads workflows from the repository root.

permissions:
  contents: write
  actions: read

on:
  push:
    branches:
      - 'main'
      - 'arena/**'
    # Every build produces a different installer, and publishing replaces the
    # files and their checksums. A change that cannot alter the binary -
    # documentation, or the screenshots of a build that has already been made -
    # must not trigger a rebuild, or the checksums quoted in the documentation
    # are stale the moment they are written.
    paths-ignore:
      - '**.md'
      - 'screenshots/**'
      - 'ci-logs/**'
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Test suite (Linux)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: JENESIS
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: JENESIS/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run the full test suite
        # The counter prints one measured total for the whole suite, so the log
        # shows exactly how many checks this commit passed. It counts the
        # results each suite *printed*, which means a suite that crashed before
        # printing anything would leave the total looking clean. `pipefail`
        # keeps npm's own exit code, so such a crash still fails the build.
        run: |
          set -o pipefail
          npm run test:all 2>&1 | tee test-all.log | node scripts/count-checks.mjs

      - name: Build the frontend
        run: npm run build

  installer:
    name: Windows installer (build, verify, install, smoke test)
    runs-on: windows-2022
    needs: tests
    defaults:
      run:
        working-directory: JENESIS
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      # The version is read once, here, and used by every file name and every
      # artefact name below. It used to be typed into three places, so a
      # corrected release could still be published under an older number.
      - name: Read the version
        id: version
        shell: bash
        run: |
          # This job runs with working-directory: JENESIS, so package.json is here.
          version=$(node -p "require('./package.json').version")
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: JENESIS/package-lock.json

      # node-gyp needs Python 3.11 when no prebuilt better-sqlite3 binary matches.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run the full test suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # This step judges external commands (npm, gh) by their exit code,
          # so a non-zero exit must be reported, not turned into a
          # terminating error by PowerShell 7.4 and later.
          $PSNativeCommandUseErrorActionPreference = $false
          npm run test:all 2>&1 | Tee-Object -FilePath test-all.log
          $code = $LASTEXITCODE
          # Keep the transcript where a failure can be read on the branch: this
          # step runs with JENESIS as its working directory, so ci-logs is one
          # level up, next to the repository root.
          # Named .txt on purpose: the repository ignores *.log files, and a
          # transcript nobody can stage is a transcript nobody can read.
          New-Item -ItemType Directory -Force -Path ..\ci-logs | Out-Null
          Copy-Item test-all.log ..\ci-logs\windows-test-all.txt -Force
          $summary = (node scripts/count-checks.mjs test-all.log 2>&1 | Out-String).Trim()
          Write-Host $summary
          if ($code -ne 0) { throw "npm run test:all failed (exit $code)" }
          # Remember how many checks really ran: the release notes must never
          # quote a number that was not measured on this build.
          $m = [regex]::Match($summary, '(\d+) checks? passed')
          if (-not $m.Success) { throw 'the check counter produced no total' }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Set-Content -Path release\checks.txt -Value $m.Groups[1].Value -Encoding ascii
          Write-Host "checks recorded for the release notes: $($m.Groups[1].Value)"

      - name: Build the frontend and the NSIS installer
        run: npm run desktop:dist

      - name: Verify the packaged application
        run: node scripts/verify-package.cjs release/win-unpacked

      - name: Smoke-test the installed application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ..\ci-logs | Out-Null
          # The file names follow the version in package.json, so a corrected
          # release can never be published under the name of an earlier one.
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $releaseName = "JEN $version"
          $installerName = "$releaseName Setup.exe"
          $installer = Get-ChildItem release -Filter $installerName | Select-Object -First 1
          if (-not $installer) { throw "The installer $installerName was not produced." }
          Write-Host "Installer: $($installer.FullName)"
          # Run in a child process so the transcript is written even when the test exits non-zero.
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\smoke-test-installed.ps1 -InstallerPath $installer.FullName 2>&1 |
            Tee-Object -FilePath ..\ci-logs\smoke-test-output.txt
          $code = $LASTEXITCODE
          # Always publish the application's own logs: they show whether the
          # close request reached the app and how shutdown progressed.
          $logDir = Join-Path $env:APPDATA 'JENESIS\logs'
          Write-Host "application log folder: $logDir (exists: $(Test-Path $logDir))"
          if (Test-Path $logDir) {
            Get-ChildItem $logDir -File | ForEach-Object {
              try { Copy-Item $_.FullName (Join-Path '..\ci-logs' $_.Name) -Force }
              catch { Write-Host "could not copy $($_.Name): $($_.Exception.Message)" }
            }
          }
          if ($code -ne 0) {
            throw "Installed-application smoke test failed (exit $code). Transcript: ci-logs/smoke-test-output.txt"
          }
          # Count the checks the smoke test actually printed and keep the score.
          $smoke = Select-String -Path ..\ci-logs\smoke-test-output.txt -Pattern '(?i)^\s*PASS' | Measure-Object
          $smokeFail = Select-String -Path ..\ci-logs\smoke-test-output.txt -Pattern '(?i)^\s*FAIL' | Measure-Object
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Set-Content -Path release\smoke.txt -Value "$($smoke.Count)/$($smoke.Count + $smokeFail.Count) PASS" -Encoding ascii
          Write-Host "smoke score recorded: $($smoke.Count) passed, $($smokeFail.Count) failed"

      - name: Package the portable build and write checksums
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # This step judges external commands (npm, gh) by their exit code,
          # so a non-zero exit must be reported, not turned into a
          # terminating error by PowerShell 7.4 and later.
          $PSNativeCommandUseErrorActionPreference = $false
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $releaseName = "JEN $version"
          $installerName = "$releaseName Setup.exe"
          $installer = Get-ChildItem release -Filter $installerName | Select-Object -First 1
          if (-not $installer) { throw "The installer $installerName was not produced." }

          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Out-File -FilePath "release\$($installer.Name).sha256" -Encoding ascii

          # Portable package: the very same unpacked application the installer
          # deploys, so JENESIS can be run from a folder or a USB stick without
          # installing anything. Data still goes to %APPDATA%\JENESIS.
          # electron-builder writes the unpacked application next to the
          # installer (directories.output = release).
          $unpacked = 'release\win-unpacked'
          if (-not (Test-Path $unpacked)) { throw "$unpacked is missing: nothing to package." }
          $zip = "release\$releaseName Portable.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$unpacked\*" -DestinationPath $zip -CompressionLevel Optimal
          $zipItem = Get-Item $zip
          $zipHash = (Get-FileHash $zipItem.FullName -Algorithm SHA256).Hash.ToLower()
          "$zipHash  $($zipItem.Name)" | Out-File -FilePath "$zip.sha256" -Encoding ascii

          Write-Host "installer : $($installer.Name)  $([math]::Round($installer.Length / 1MB, 1)) MB  sha256 $hash"
          Write-Host "portable  : $($zipItem.Name)  $([math]::Round($zipItem.Length / 1MB, 1)) MB  sha256 $zipHash"

          # Show the download table on the run page, and keep it for the notes.
          $table = @(
            "| ``$($installer.Name)`` | $([math]::Round($installer.Length / 1MB, 1)) MB | ``$hash`` |",
            "| ``$($zipItem.Name)`` | $([math]::Round($zipItem.Length / 1MB, 1)) MB | ``$zipHash`` |"
          )
          $summary = $env:GITHUB_STEP_SUMMARY
          "### $releaseName — downloadable files" | Out-File -FilePath $summary -Encoding utf8
          '' | Out-File -FilePath $summary -Append -Encoding utf8
          '| File | Size | SHA-256 |' | Out-File -FilePath $summary -Append -Encoding utf8
          '|---|---|---|' | Out-File -FilePath $summary -Append -Encoding utf8
          $table | Out-File -FilePath $summary -Append -Encoding utf8
          $table | Out-File -FilePath release\download-table.md -Encoding utf8

      - name: Package the source backup
        if: success()
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          mkdir -p JENESIS/release
          # Tracked files only: node_modules, dist and release are not in git,
          # so the archive is the real source of this release and nothing else.
          version=$(node -p "require('./JENESIS/package.json').version")
          release="JEN $version"
          echo "source backup: $release.zip"
          # The archive holds the source of THIS build, so the documents inside
          # it have to name it - and git archive reads the committed tree, which
          # cannot know which build is running. Stamp the documents first and
          # commit them on the runner (that commit leaves the machine only as
          # part of this branch), then cut the archive from it. A checksum this
          # build has not measured yet is dropped rather than left claiming an
          # earlier build's number; the archive's own checksum cannot exist
          # until the archive does, so it is stamped afterwards.
          node "$GITHUB_WORKSPACE/JENESIS/scripts/stamp-download-table.cjs" \
            --table "$GITHUB_WORKSPACE/JENESIS/release/download-table.md" \
            --download "$GITHUB_WORKSPACE/JENESIS/DOWNLOAD.md" \
            --also "$GITHUB_WORKSPACE/JENESIS/$release RELEASE NOTES.md" \
            --also "$GITHUB_WORKSPACE/JENESIS/JENESIS-$version-PROGRESS.md" \
            --run "$GITHUB_RUN_ID" --commit "$(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Stage the stamped documents and archive that tree. git archive will
          # take a tree, not only a commit, so the archive gets the stamped
          # documents without a commit being made for the archive's sake.
          git add -A -f "$GITHUB_WORKSPACE/JENESIS/DOWNLOAD.md" "$GITHUB_WORKSPACE/JENESIS/$release RELEASE NOTES.md" "$GITHUB_WORKSPACE/JENESIS/JENESIS-$version-PROGRESS.md"
          tree=$(git write-tree)
          git archive --format=zip -o "JENESIS/release/$release.zip" "$tree" ":(exclude)JENESIS/dist"
          cd JENESIS/release
          sha256sum "$release.zip" > "$release.zip.sha256"
          ls -l "$release.zip"
          cat "$release.zip.sha256"
          # The download table is written before this step, so the source backup
          # was the one published file missing from it. Add its row here rather
          # than leave the release claiming two checksums out of three.
          hash=$(cut -d' ' -f1 < "$release.zip.sha256")
          size=$(stat -c %s "$release.zip")
          mb=$(awk -v n="$size" 'BEGIN { printf "%.1f", n / 1048576 }')
          echo "| \`$release.zip\` | $mb MB | \`$hash\` |" >> download-table.md
          echo "--- download table ---"
          cat download-table.md

          # The written record travels with the build, so every published
          # document has to name THIS build - not whichever one somebody last
          # typed the numbers in for. DOWNLOAD.md also carries the sizes and
          # checksums measured above.
          node "$GITHUB_WORKSPACE/JENESIS/scripts/stamp-download-table.cjs" \
            --table "$GITHUB_WORKSPACE/JENESIS/release/download-table.md" \
            --download "$GITHUB_WORKSPACE/JENESIS/DOWNLOAD.md" \
            --also "$GITHUB_WORKSPACE/JENESIS/$release RELEASE NOTES.md" \
            --also "$GITHUB_WORKSPACE/JENESIS/JENESIS-$version-PROGRESS.md" \
            --run "$GITHUB_RUN_ID" --commit "$(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)"
          echo "--- the download table as the document will publish it ---"
          grep -n '^| `JEN ' "$GITHUB_WORKSPACE/JENESIS/DOWNLOAD.md" || true
          grep -n 'run [0-9]*, commit' "$GITHUB_WORKSPACE/JENESIS/DOWNLOAD.md" | head -2 || true

          # Now that every file has been measured, commit the finished
          # documents. The copy in the repository should end up carrying all
          # three checksums, not only the two known when the archive was cut.
          git add -A -f "$GITHUB_WORKSPACE/JENESIS/DOWNLOAD.md" "$GITHUB_WORKSPACE/JENESIS/$release RELEASE NOTES.md" "$GITHUB_WORKSPACE/JENESIS/JENESIS-$version-PROGRESS.md"
          if git diff --cached --quiet; then echo "the documents already carry this build's numbers"; else
            git commit -q -m "docs: checksums and build reference for run $GITHUB_RUN_ID"
          fi

      - name: Stage the release folder
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # This step judges external commands (npm, gh) by their exit code,
          # so a non-zero exit must be reported, not turned into a
          # terminating error by PowerShell 7.4 and later.
          $PSNativeCommandUseErrorActionPreference = $false
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $releaseName = "JEN $version"
          $folder = "release\$releaseName"
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item "release\$releaseName Setup.exe" $folder -Force
          Copy-Item "release\$releaseName Portable.zip" $folder -Force
          Get-ChildItem release -Filter '*.sha256' | ForEach-Object { Copy-Item $_.FullName $folder -Force }
          if (Test-Path 'release\download-table.md') { Copy-Item 'release\download-table.md' $folder -Force }
          if (Test-Path "release\$releaseName.zip") { Copy-Item "release\$releaseName.zip" $folder -Force }
          # The written record of the build travels with it. Someone holding the
          # downloaded file should not have to go looking through the repository
          # for what changed, what was tested and what was not.
          foreach ($doc in @(
            "JEN $version RELEASE NOTES.md",
            "JENESIS-$version-PROGRESS.md",
            'DOWNLOAD.md',
            'README.md'
          )) {
            if (Test-Path $doc) { Copy-Item $doc $folder -Force }
          }
          Get-ChildItem $folder | ForEach-Object { Write-Host "release folder: $($_.Name)  $([math]::Round($_.Length / 1MB, 1)) MB" }

      - name: Upload the source backup
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JEN ${{ steps.version.outputs.value }} source backup
          path: |
            JENESIS/release/*.zip
            JENESIS/release/*.zip.sha256
          if-no-files-found: error

      - name: Upload the installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JENESIS-Windows-installer
          path: |
            JENESIS/release/*.exe
            JENESIS/release/*.sha256
          if-no-files-found: ignore

      # The runner has no display, but PrintWindow still renders each window
      # into a bitmap. These are real pictures of the installed applications,
      # and they are the only way this release can show them.
      - name: Upload the screenshots of the installed applications
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JENESIS-screenshots
          path: |
            JENESIS/release/screenshots/*.bmp
          if-no-files-found: warn

      # A release asset cannot be downloaded from every environment, so a
      # half-size copy is committed here as well. That is the only way the
      # pictures of the four applications can actually be looked at from the
      # outside rather than merely being known to exist.
      - name: Keep the screenshots on the branch
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p screenshots
          found=0
          for f in JENESIS/release/screenshots/*.bmp; do
            [ -f "$f" ] || continue
            name="$(basename "$f" .bmp)"
            node JENESIS/scripts/shrink-screenshot.cjs "$f" "screenshots/$name.bmp" \
              || cp "$f" "screenshots/$name.bmp"
            # A PNG as well: a 32-bit BMP is what the runner can write without
            # System.Drawing, but it is not what anyone can open afterwards.
            node JENESIS/scripts/bmp-to-png.cjs "screenshots/$name.bmp" "screenshots/$name.png" || true
            # And next to the full-size originals, so the release carries both.
            node JENESIS/scripts/bmp-to-png.cjs "$f" "JENESIS/release/screenshots/$name.png" || true
            found=1
          done
          if [ "$found" = "0" ]; then echo "no screenshots to publish"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A -f screenshots
          if git diff --cached --quiet; then echo "the screenshots are unchanged"; else
            git commit -m "ci: screenshots of the installed applications, run ${{ github.run_id }}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

      - name: Upload the portable package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JEN ${{ steps.version.outputs.value }} Portable
          path: |
            JENESIS/release/*.zip
            JENESIS/release/*.zip.sha256
          if-no-files-found: ignore

      - name: Publish the downloadable files as a release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # This step judges external commands (npm, gh) by their exit code,
          # so a non-zero exit must be reported, not turned into a
          # terminating error by PowerShell 7.4 and later.
          $PSNativeCommandUseErrorActionPreference = $false
          # From PowerShell 7.4 a native command that exits non-zero becomes a
          # terminating error when $ErrorActionPreference is 'Stop'. This step
          # asks `gh` whether the release already exists and judges the answer
          # by its exit code — "no" is an expected answer, not a failure — so
          # native commands must report their exit code instead of throwing.
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force -Path ..\ci-logs | Out-Null
          # This step runs last and its own log is the hardest to reach, so any
          # terminating error is written to the branch by the diagnostics step
          # below: the failure then says what it was instead of only "exit 1".
          trap {
            $report = @(
              'PUBLISH STEP FAILED'
              "message:  $($_.Exception.Message)"
              "position: $($_.InvocationInfo.PositionMessage)"
              "assets:   $($assets -join ', ')"
              'stack:'
              $_.ScriptStackTrace
            ) -join "\n"
            Set-Content -Path ..\ci-logs\publish-error.txt -Value $report -Encoding utf8
            exit 1
          }
          Write-Host "PowerShell $($PSVersionTable.PSVersion); gh $(gh --version | Select-Object -First 1)"
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $assets = @()
          foreach ($pattern in '*.exe', '*.zip', '*.sha256') {
            $assets += (Get-ChildItem release -Filter $pattern | ForEach-Object { $_.FullName })
          }
          # Real pictures of the four applications, taken from the installed
          # windows during the smoke test, in both formats: the BMP the runner
          # can write and the PNG anyone can open.
          if (Test-Path release\screenshots) {
            foreach ($pattern in '*.bmp', '*.png') {
              $assets += (Get-ChildItem 'release\screenshots' -Filter $pattern | ForEach-Object { $_.FullName })
            }
          }
          # The documentation of this build, published with the build.
          foreach ($doc in @(
            "JEN $version RELEASE NOTES.md",
            "JENESIS-$version-PROGRESS.md",
            'DOWNLOAD.md',
            'README.md'
          )) {
            if (Test-Path $doc) { $assets += (Resolve-Path $doc).Path }
          }
          if ($assets.Count -eq 0) { throw 'No downloadable files were produced.' }

          # Every number in the notes is measured on this build, never typed in.
          $checks = if (Test-Path release\checks.txt) { (Get-Content release\checks.txt -Raw).Trim() } else { 'unknown' }
          $smoke  = if (Test-Path release\smoke.txt)  { (Get-Content release\smoke.txt -Raw).Trim() }  else { 'not recorded' }
          $table  = if (Test-Path release\download-table.md) { (Get-Content release\download-table.md -Raw).Trim() } else { '' }
          # Did the credentials typed into the window really reach the interface?
          # The smoke test records it; the notes must never imply more than that.
          $signin = if (Test-Path release\interface-signin.txt) { (Get-Content release\interface-signin.txt -Raw).Trim() } else { 'not recorded' }

          $releaseName = "JEN $version"
          $notes = @"
          $releaseName — JENESIS desktop business and accounting software.
          **Four applications in one installation, sharing one database.**

          **Install:** download ``$releaseName Setup.exe``, double-click it, accept
          the SmartScreen prompt (More info -> Run anyway), and follow the
          installer. **Four shortcuts** then appear on the Desktop and in the
          Start menu, each with its own colour and icon — no command prompt
          needed. See ``DOWNLOAD.md`` in the repository for details, database
          location and backup instructions.

          **Portable:** ``$releaseName Portable.zip`` runs without installing
          (unzip, then double-click ``JENESIS.exe``).

          ## The four applications

          | Shortcut | What it is for |
          |---|---|
          | **JENESIS Seller** (red) | Selling: the dashboard, sales, customers and stock. No reports, no accounting. |
          | **JENESIS Network & Maintenance** (green) | The network: finding the other JENESIS computers, connecting to them, the service, backups, integrity and logs. No business screens at all. |
          | **JENESIS Accounting & Business** (blue) | The whole program: sales, purchases, inventory, banking, accounting and every report. Formerly called JENESIS Admin. |
          | **JENESIS Settings & Access Point** (yellow) | Configuration: the company, the users and their permissions, taxes, currencies and backups. Administrators and managers only. |

          All four open **the same company database**. The shortcuts only choose
          which face of the same installation the window opens with.

          ## What is new in 0.5.5

          **Right-click works everywhere.** Copy, Cut, Paste, Edit, Delete,
          Deactivate, Activate and Select All on the records of all four
          applications, showing only what makes sense for the row under the
          cursor. Destructive actions always ask first, and the question names
          the record. Your role decides what appears — and the server asks the
          same question, so the menu is never the only gate. An accounting
          record is **never destroyed**: it is deactivated, and the menu says
          why. The menu is drawn in the colour of the application it opens in,
          and no keyboard shortcut was taken away.

          **JENESIS Seller has its own dashboard.** A screen built around the
          day at the counter: new sale, sales history, customers, product
          search, availability, stock (read-only), receipt printing, the day's
          takings and the cash register. The accounting dashboard, the profit
          and loss, the balance sheet, the trial balance, the general ledger,
          the payables and the receivables are **not on it** — and are now
          **refused by the server** too, so they cannot be reached by typing a
          request by hand either. Sales still post into the one shared
          accounting database: stock, the ledger and the till move together.

          **JENESIS Settings & Access Point owns the settings.** User accounts
          (create, rename, reset a forgotten password, deactivate, delete),
          access to each of the four applications, roles and individual
          permissions, tax rates, the company record, language and theme — all
          of it in the yellow application, and **removed from Accounting &
          Business rather than copied**. A tax rate that has been used in a
          transaction **cannot be deleted**, only deactivated; deactivating it
          changes **nothing** in any document already raised; a retired rate is
          no longer offered for new transactions; every change is written to
          the audit trail. Every change is numbered, and an open window
          notices the number move and reads its permissions again.

          **$checks automated checks** pass across the whole suite, and the
          installed-application smoke test reports **$smoke**.

          ## Checksums

          | File | Size | SHA-256 |
          |---|---|---|
          $table

          Verify a download with ``certutil -hashfile <file> SHA256`` and compare with
          the ``.sha256`` file shipped next to it.

          ## Screenshots

          The runner has no display, but a window can still be rendered into a
          bitmap, so every window this build verifies is photographed. The four
          pictures attached to this release are real images of the installed
          applications, taken while the smoke test had them open — one per
          application, window for window: ``JENESIS-Seller.bmp``,
          ``JENESIS-Network-Maintenance.bmp``,
          ``JENESIS-Accounting-Business.bmp`` and
          ``JENESIS-Settings-Access-Point.bmp``. They are also published in the
          ``JENESIS-screenshots`` artefact of the run.

          ``JENESIS-Seller-Dashboard.bmp`` and
          ``JENESIS-Settings-Signed-In.bmp`` are taken after the smoke test
          delivered the credentials into the window, so they show the two
          screens this release is about as a signed-in user sees them. A runner
          has no keyboard, so the credentials are delivered three ways - the
          Chromium DevTools Protocol (real input events), SendKeys, and WM_CHAR
          posted into the window - and the run records which one worked. If none
          reached the interface, the picture is of the sign-in screen and the
          run says so.

          They are the installed build, not a mock-up, but they are still a
          machine's picture of a window: nobody has looked at these screens by
          eye, and the two themes have never been seen by a person.

          ## Not verified

          The installer is **unsigned** (Windows SmartScreen will warn) and has
          been verified on a GitHub-hosted Windows runner, **not on a physical
          PC**. Real PCs differ — antivirus, SmartScreen, graphics drivers and
          user account control are all things this runner does not have.

          **Messenger between two separate physical computers is not proven by
          this run.** The network mechanism is tested between two real services,
          but two services on one machine is not two computers. The check for
          that is ``scripts\messenger-two-computers.cjs`` — run it from a second
          PC on your network against a running JENESIS.

          Built, verified and smoke-tested by GitHub Actions, run
          ${{ github.run_id }}, commit ${{ github.sha }}.
          * $checks automated checks pass (whole suite, real SQLite database).
          * Installed-application smoke test: $smoke.
          * Credentials typed into the window the way a user signs in: the
            interface **$signin** it reached the signed-in screen.
          "@
          $notes | Out-File -FilePath ..\release-notes.md -Encoding utf8

          gh release view $tag --repo ${{ github.repository }}
          Write-Host "gh release view exit code: $LASTEXITCODE"
          if ($LASTEXITCODE -eq 0) {
            Write-Host "release $tag exists: replacing its files and refreshing the notes"
            # Refresh the notes first: the page must describe the files that are
            # about to be attached, not those of an older build.
            gh release edit $tag --notes-file ..\release-notes.md --repo ${{ github.repository }}
            gh release upload $tag $assets --clobber --repo ${{ github.repository }}
          } else {
            Write-Host "creating release $tag"
            gh release create $tag $assets --title "$releaseName" --notes-file ..\release-notes.md --repo ${{ github.repository }}
          }

      - name: Upload diagnostics when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-diagnostics
          path: |
            JENESIS/release/**/builder-debug.yml
            ci-logs/
          if-no-files-found: warn

      # A failing job publishes its transcript as a commit on this branch so the
      # failure can be diagnosed even when log archives cannot be downloaded.
      # Delete the ci-logs folder once the failure is understood; a green run
      # does not create it.
      - name: Commit smoke-test diagnostics to the branch
        # Always, not only on failure. The transcript of a passing run is what
        # answers "what exactly did it prove?" afterwards; keeping it only when
        # something broke means the only copy on the branch is a stale one from
        # whichever run last failed.
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p ci-logs
          # The transcript of the smoke test and the application's own logs,
          # whatever the outcome. This step runs last either way, so the copy
          # happens even if an earlier step stopped short.
          if [ -f JENESIS/test-all.log ]; then cp JENESIS/test-all.log ci-logs/windows-test-all.txt; fi
          if [ -f JENESIS/release/smoke.txt ]; then cp JENESIS/release/smoke.txt ci-logs/smoke-score.txt; fi
          if [ -f JENESIS/release/interface-signin.txt ]; then cp JENESIS/release/interface-signin.txt ci-logs/interface-signin.txt; fi
          if [ -d "$APPDATA/JENESIS/logs" ]; then cp -r "$APPDATA/JENESIS/logs/." ci-logs/ || true; fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A -f ci-logs
          if git diff --cached --quiet; then echo "no diagnostics to commit"; else
            git commit -m "ci: Windows smoke-test diagnostics for run ${{ github.run_id }}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
