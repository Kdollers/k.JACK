name: JENESIS Windows installer

# Builds and verifies the JENESIS desktop installer for Windows.
#
# Job 1 (tests) runs the whole suite on Linux on every push.
# Job 2 (installer) produces release/JEN <version> Setup.exe on Windows,
# verifies the packaged folder and smoke-tests the INSTALLED application
# (install -> launch -> first-run setup -> sign-in -> accounting entry ->
# backup -> close -> relaunch -> data still there -> uninstall keeps data).
#
# The application source lives in the JENESIS/ folder of this repository. If you
# move JENESIS/ into its own repository, move this .github folder with it:
# GitHub only reads workflows from the repository root.

permissions:
  contents: write
  actions: read

on:
  push:
    branches:
      - 'main'
      - 'arena/**'
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Test suite (Linux)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: JENESIS
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: JENESIS/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run the full test suite
        # The counter prints one measured total for the whole suite and exits
        # non-zero if anything failed, so the log shows exactly how many checks
        # this commit passed.
        run: npm run test:all 2>&1 | node scripts/count-checks.mjs

      - name: Build the frontend
        run: npm run build

  installer:
    name: Windows installer (build, verify, install, smoke test)
    runs-on: windows-2022
    needs: tests
    defaults:
      run:
        working-directory: JENESIS
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      # The version is read once, here, and used by every file name and every
      # artefact name below. It used to be typed into three places, so a
      # corrected release could still be published under an older number.
      - name: Read the version
        id: version
        shell: bash
        run: |
          # This job runs with working-directory: JENESIS, so package.json is here.
          version=$(node -p "require('./package.json').version")
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: JENESIS/package-lock.json

      # node-gyp needs Python 3.11 when no prebuilt better-sqlite3 binary matches.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run the full test suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # This step judges external commands (npm, gh) by their exit code,
          # so a non-zero exit must be reported, not turned into a
          # terminating error by PowerShell 7.4 and later.
          $PSNativeCommandUseErrorActionPreference = $false
          npm run test:all 2>&1 | Tee-Object -FilePath test-all.log
          $code = $LASTEXITCODE
          $summary = (node scripts/count-checks.mjs test-all.log 2>&1 | Out-String).Trim()
          Write-Host $summary
          if ($code -ne 0) { throw "npm run test:all failed (exit $code)" }
          # Remember how many checks really ran: the release notes must never
          # quote a number that was not measured on this build.
          $m = [regex]::Match($summary, '(\d+) checks? passed')
          if (-not $m.Success) { throw 'the check counter produced no total' }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Set-Content -Path release\checks.txt -Value $m.Groups[1].Value -Encoding ascii
          Write-Host "checks recorded for the release notes: $($m.Groups[1].Value)"

      - name: Build the frontend and the NSIS installer
        run: npm run desktop:dist

      - name: Verify the packaged application
        run: node scripts/verify-package.cjs release/win-unpacked

      - name: Smoke-test the installed application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ..\ci-logs | Out-Null
          # The file names follow the version in package.json, so a corrected
          # release can never be published under the name of an earlier one.
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $releaseName = "JEN $version"
          $installerName = "$releaseName Setup.exe"
          $installer = Get-ChildItem release -Filter $installerName | Select-Object -First 1
          if (-not $installer) { throw "The installer $installerName was not produced." }
          Write-Host "Installer: $($installer.FullName)"
          # Run in a child process so the transcript is written even when the test exits non-zero.
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\smoke-test-installed.ps1 -InstallerPath $installer.FullName 2>&1 |
            Tee-Object -FilePath ..\ci-logs\smoke-test-output.txt
          $code = $LASTEXITCODE
          # Always publish the application's own logs: they show whether the
          # close request reached the app and how shutdown progressed.
          $logDir = Join-Path $env:APPDATA 'JENESIS\logs'
          Write-Host "application log folder: $logDir (exists: $(Test-Path $logDir))"
          if (Test-Path $logDir) {
            Get-ChildItem $logDir -File | ForEach-Object {
              try { Copy-Item $_.FullName (Join-Path '..\ci-logs' $_.Name) -Force }
              catch { Write-Host "could not copy $($_.Name): $($_.Exception.Message)" }
            }
          }
          if ($code -ne 0) {
            throw "Installed-application smoke test failed (exit $code). Transcript: ci-logs/smoke-test-output.txt"
          }
          # Count the checks the smoke test actually printed and keep the score.
          $smoke = Select-String -Path ..\ci-logs\smoke-test-output.txt -Pattern '(?i)^\s*PASS' | Measure-Object
          $smokeFail = Select-String -Path ..\ci-logs\smoke-test-output.txt -Pattern '(?i)^\s*FAIL' | Measure-Object
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Set-Content -Path release\smoke.txt -Value "$($smoke.Count)/$($smoke.Count + $smokeFail.Count) PASS" -Encoding ascii
          Write-Host "smoke score recorded: $($smoke.Count) passed, $($smokeFail.Count) failed"

      - name: Package the portable build and write checksums
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # This step judges external commands (npm, gh) by their exit code,
          # so a non-zero exit must be reported, not turned into a
          # terminating error by PowerShell 7.4 and later.
          $PSNativeCommandUseErrorActionPreference = $false
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $releaseName = "JEN $version"
          $installerName = "$releaseName Setup.exe"
          $installer = Get-ChildItem release -Filter $installerName | Select-Object -First 1
          if (-not $installer) { throw "The installer $installerName was not produced." }

          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Out-File -FilePath "release\$($installer.Name).sha256" -Encoding ascii

          # Portable package: the very same unpacked application the installer
          # deploys, so JENESIS can be run from a folder or a USB stick without
          # installing anything. Data still goes to %APPDATA%\JENESIS.
          # electron-builder writes the unpacked application next to the
          # installer (directories.output = release).
          $unpacked = 'release\win-unpacked'
          if (-not (Test-Path $unpacked)) { throw "$unpacked is missing: nothing to package." }
          $zip = "release\$releaseName Portable.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$unpacked\*" -DestinationPath $zip -CompressionLevel Optimal
          $zipItem = Get-Item $zip
          $zipHash = (Get-FileHash $zipItem.FullName -Algorithm SHA256).Hash.ToLower()
          "$zipHash  $($zipItem.Name)" | Out-File -FilePath "$zip.sha256" -Encoding ascii

          Write-Host "installer : $($installer.Name)  $([math]::Round($installer.Length / 1MB, 1)) MB  sha256 $hash"
          Write-Host "portable  : $($zipItem.Name)  $([math]::Round($zipItem.Length / 1MB, 1)) MB  sha256 $zipHash"

          # Show the download table on the run page, and keep it for the notes.
          $table = @(
            "| ``$($installer.Name)`` | $([math]::Round($installer.Length / 1MB, 1)) MB | ``$hash`` |",
            "| ``$($zipItem.Name)`` | $([math]::Round($zipItem.Length / 1MB, 1)) MB | ``$zipHash`` |"
          )
          $summary = $env:GITHUB_STEP_SUMMARY
          "### $releaseName — downloadable files" | Out-File -FilePath $summary -Encoding utf8
          '' | Out-File -FilePath $summary -Append -Encoding utf8
          '| File | Size | SHA-256 |' | Out-File -FilePath $summary -Append -Encoding utf8
          '|---|---|---|' | Out-File -FilePath $summary -Append -Encoding utf8
          $table | Out-File -FilePath $summary -Append -Encoding utf8
          $table | Out-File -FilePath release\download-table.md -Encoding utf8

      - name: Stage the release folder
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # This step judges external commands (npm, gh) by their exit code,
          # so a non-zero exit must be reported, not turned into a
          # terminating error by PowerShell 7.4 and later.
          $PSNativeCommandUseErrorActionPreference = $false
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $releaseName = "JEN $version"
          $folder = "release\$releaseName"
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item "release\$releaseName Setup.exe" $folder -Force
          Copy-Item "release\$releaseName Portable.zip" $folder -Force
          Get-ChildItem release -Filter '*.sha256' | ForEach-Object { Copy-Item $_.FullName $folder -Force }
          if (Test-Path 'release\download-table.md') { Copy-Item 'release\download-table.md' $folder -Force }
          if (Test-Path "release\$releaseName.zip") { Copy-Item "release\$releaseName.zip" $folder -Force }
          Get-ChildItem $folder | ForEach-Object { Write-Host "release folder: $($_.Name)  $([math]::Round($_.Length / 1MB, 1)) MB" }

      - name: Package the source backup
        if: success()
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          mkdir -p JENESIS/release
          # Tracked files only: node_modules, dist and release are not in git,
          # so the archive is the real source of this release and nothing else.
          release="JEN $(node -p "require('./JENESIS/package.json').version")"
          echo "source backup: $release.zip"
          git archive --format=zip -o "JENESIS/release/$release.zip" HEAD ":(exclude)JENESIS/dist"
          cd JENESIS/release
          sha256sum "$release.zip" > "$release.zip.sha256"
          ls -l "$release.zip"
          cat "$release.zip.sha256"

      - name: Upload the source backup
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JEN ${{ steps.version.outputs.value }} source backup
          path: |
            JENESIS/release/*.zip
            JENESIS/release/*.zip.sha256
          if-no-files-found: error

      - name: Upload the installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JENESIS-Windows-installer
          path: |
            JENESIS/release/*.exe
            JENESIS/release/*.sha256
          if-no-files-found: ignore

      - name: Upload the portable package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JEN ${{ steps.version.outputs.value }} Portable
          path: |
            JENESIS/release/*.zip
            JENESIS/release/*.zip.sha256
          if-no-files-found: ignore

      - name: Publish the downloadable files as a release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # This step judges external commands (npm, gh) by their exit code,
          # so a non-zero exit must be reported, not turned into a
          # terminating error by PowerShell 7.4 and later.
          $PSNativeCommandUseErrorActionPreference = $false
          # From PowerShell 7.4 a native command that exits non-zero becomes a
          # terminating error when $ErrorActionPreference is 'Stop'. This step
          # asks `gh` whether the release already exists and judges the answer
          # by its exit code — "no" is an expected answer, not a failure — so
          # native commands must report their exit code instead of throwing.
          $PSNativeCommandUseErrorActionPreference = $false
          Write-Host "PowerShell $($PSVersionTable.PSVersion); gh $(gh --version | Select-Object -First 1)"
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $assets = @()
          foreach ($pattern in '*.exe', '*.zip', '*.exe.sha256', '*.zip.sha256') {
            $assets += (Get-ChildItem release -Filter $pattern | ForEach-Object { $_.FullName })
          }
          if ($assets.Count -eq 0) { throw 'No downloadable files were produced.' }

          # Every number in the notes is measured on this build, never typed in.
          $checks = if (Test-Path release\checks.txt) { (Get-Content release\checks.txt -Raw).Trim() } else { 'unknown' }
          $smoke  = if (Test-Path release\smoke.txt)  { (Get-Content release\smoke.txt -Raw).Trim() }  else { 'not recorded' }
          $table  = if (Test-Path release\download-table.md) { (Get-Content release\download-table.md -Raw).Trim() } else { '' }
          # Did the credentials typed into the window really reach the interface?
          # The smoke test records it; the notes must never imply more than that.
          $signin = if (Test-Path release\interface-signin.txt) { (Get-Content release\interface-signin.txt -Raw).Trim() } else { 'not recorded' }

          $releaseName = "JEN $version"
          $notes = @"
          $releaseName — JENESIS desktop accounting application (Seller,
          Maintenance, Admin). **This is the corrected build that repairs the
          Profit & Loss and Balance Sheet screens and the keys the header
          advertised for the calculator and Messenger.**

          **Install:** download ``$releaseName Setup.exe``, double-click it, accept
          the SmartScreen prompt (More info -> Run anyway), and follow the
          installer. JENESIS then appears on the Desktop and in the Start menu —
          no command prompt needed. See ``DOWNLOAD.md`` in the repository for
          details, database location and backup instructions.

          **Portable:** ``$releaseName Portable.zip`` runs without installing
          (unzip, then double-click ``JENESIS.exe``).

          ## What was repaired

          **1. Profit & Loss and Balance Sheet stopped the whole interface.**
          Opening either report left the screen blank or replaced the whole
          window with "JENESIS could not display this screen" — and because the
          error screen covers the entire interface, every other screen looked
          broken too until the window was restarted.

          Cause: the screen kept the answer of the report that was open before it
          (the trial balance) while the new one was loading, then read
          ``revenueRows`` and ``assets.current`` from a payload that does not
          have them, and threw. A slow answer or a quick click on the tab was
          enough.

          This build:

          * **clears the previous answer before asking for a new one**, so the
            screen can never be drawn with another report's figures;
          * **tags every report answer** with the report it belongs to, and
            refuses an answer that arrives for a report the user has left;
          * **shows "no figures for this period"** when a period really is empty,
            instead of a blank page that looks like a failure;
          * tests it: 13 checks on the rule that decides what may be drawn, and
            on the figures themselves against a real database with posted
            entries.

          **2. The Profit & Loss figure was wrong when other income existed.**
          Revenue of the "other" kind (interest received, a gain on a disposal)
          was reported as operating revenue, and other expenses as operating
          expenses. They are now separate lines, and the report shows the
          **operating profit** the business earned before them:

          net profit = operating profit + other income − other expenses.

          **3. The header advertised the wrong keys.** The calculator button was
          labelled ``Ctrl+Shift+C`` — those keys open **Customers**, and they also
          close an open calculator — while the calculator is ``Ctrl+Shift+K``.
          The Messenger button was labelled ``Ctrl+K`` instead of
          ``Ctrl+Shift+M``. Both labels are now read out of the single shortcut
          list, so a label cannot drift away from the keys that really work.

          Carried over from the previous build: the signed-in crash
          (``ReferenceError: MessageSquare is not defined``) is repaired, no
          interface file may draw a component it does not import (checked before
          every production build), and ``genesis:get-app-info`` answers with the
          application of the window that asked.

          ## What this build is

          Built, verified and smoke-tested by GitHub Actions, run
          ${{ github.run_id }}, commit ${{ github.sha }}.

          * $checks automated checks pass (whole suite, real SQLite database).
            Every screen is drawn by a test as well: the twelve screens and the
            shared header, sidebar, calculator and shortcut reference are
            rendered with React and must not throw.
          * Installed-application smoke test: $smoke — silent install, desktop and
            Start-menu shortcuts, the application starting on its own from the
            executable, **the interface and all of its files being served**, the
            window showing real content and not a blank screen, the interface
            reporting a successful start, first-run setup, sign-in, a balanced
            journal entry, backup and restore, clean shutdown, relaunch with the
            data intact, and uninstall keeping the business database.
          * Credentials typed into the window the way a user signs in: the
            interface **$signin** it reached the signed-in screen (the run fails
            on any error the interface reports, whether or not the keys arrive).

          ## Checksums

          | File | Size | SHA-256 |
          |---|---|---|
          $table

          Verify a download with ``certutil -hashfile <file> SHA256`` and compare with
          the ``.sha256`` file shipped next to it.

          ## Not verified

          The installer is **unsigned** (Windows SmartScreen will warn) and has not
          been run on a physical Windows PC — it is verified on a GitHub-hosted
          Windows runner only. No screenshots were produced: the runner has no
          display, so the window is checked by capturing its pixels instead.

          Inventory was reported as "not working" on the previous build. Its
          endpoints and its screen were tested here and no fault was found; the
          most likely explanation is the report crash above, whose error screen
          covers every screen at once. It remains **unconfirmed**: if Inventory
          still shows an error on this build, the message and the diagnostic
          reference on the screen identify it exactly.

          $notes | Out-File -FilePath ..\release-notes.md -Encoding utf8

          gh release view $tag --repo ${{ github.repository }}
          Write-Host "gh release view exit code: $LASTEXITCODE"
          if ($LASTEXITCODE -eq 0) {
            Write-Host "release $tag exists: replacing its files and refreshing the notes"
            # Refresh the notes first: the page must describe the files that are
            # about to be attached, not those of an older build.
            gh release edit $tag --notes-file ..\release-notes.md --repo ${{ github.repository }}
            gh release upload $tag $assets --clobber --repo ${{ github.repository }}
          } else {
            Write-Host "creating release $tag"
            gh release create $tag $assets --title "$releaseName" --notes-file ..\release-notes.md --repo ${{ github.repository }}
          }

      - name: Upload diagnostics when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-diagnostics
          path: |
            JENESIS/release/**/builder-debug.yml
            ci-logs/
          if-no-files-found: warn

      # A failing job publishes its transcript as a commit on this branch so the
      # failure can be diagnosed even when log archives cannot be downloaded.
      # Delete the ci-logs folder once the failure is understood; a green run
      # does not create it.
      - name: Commit smoke-test diagnostics to the branch
        if: failure()
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p ci-logs
          if [ -d "$APPDATA/JENESIS/logs" ]; then cp -r "$APPDATA/JENESIS/logs/." ci-logs/ || true; fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A ci-logs
          if git diff --cached --quiet; then echo "no diagnostics to commit"; else
            git commit -m "ci: Windows smoke-test diagnostics for run ${{ github.run_id }}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
