name: JENESIS Windows installer

# Builds and verifies the JENESIS desktop installer for Windows.
#
# Job 1 (tests) runs the whole suite on Linux on every push.
# Job 2 (installer) produces release/JENESIS-Setup-<version>.exe on Windows,
# verifies the packaged folder and smoke-tests the INSTALLED application
# (install -> launch -> first-run setup -> sign-in -> accounting entry ->
# backup -> close -> relaunch -> data still there -> uninstall keeps data).
#
# The application source lives in the JENESIS/ folder of this repository. If you
# move JENESIS/ into its own repository, move this .github folder with it:
# GitHub only reads workflows from the repository root.

permissions:
  contents: write
  actions: read

on:
  push:
    branches:
      - 'main'
      - 'arena/**'
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Test suite (Linux)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: JENESIS
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: JENESIS/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run the full test suite
        run: npm run test:all

      - name: Build the frontend
        run: npm run build

  installer:
    name: Windows installer (build, verify, install, smoke test)
    runs-on: windows-2022
    needs: tests
    defaults:
      run:
        working-directory: JENESIS
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: JENESIS/package-lock.json

      # node-gyp needs Python 3.11 when no prebuilt better-sqlite3 binary matches.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run the full test suite
        run: npm run test:all

      - name: Build the frontend and the NSIS installer
        run: npm run desktop:dist

      - name: Verify the packaged application
        run: node scripts/verify-package.cjs release/win-unpacked

      - name: Smoke-test the installed application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ..\ci-logs | Out-Null
          $installer = Get-ChildItem release -Filter 'JENESIS-Setup-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'The installer was not produced.' }
          Write-Host "Installer: $($installer.FullName)"
          # Run in a child process so the transcript is written even when the test exits non-zero.
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\smoke-test-installed.ps1 -InstallerPath $installer.FullName 2>&1 |
            Tee-Object -FilePath ..\ci-logs\smoke-test-output.txt
          $code = $LASTEXITCODE
          # Always publish the application's own logs: they show whether the
          # close request reached the app and how shutdown progressed.
          $logDir = Join-Path $env:APPDATA 'JENESIS\logs'
          Write-Host "application log folder: $logDir (exists: $(Test-Path $logDir))"
          if (Test-Path $logDir) {
            Get-ChildItem $logDir -File | ForEach-Object {
              try { Copy-Item $_.FullName (Join-Path '..\ci-logs' $_.Name) -Force }
              catch { Write-Host "could not copy $($_.Name): $($_.Exception.Message)" }
            }
          }
          if ($code -ne 0) {
            throw "Installed-application smoke test failed (exit $code). Transcript: ci-logs/smoke-test-output.txt"
          }

      - name: Upload the installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JENESIS-Windows-installer
          path: JENESIS/release/*.exe
          if-no-files-found: ignore

      - name: Upload diagnostics when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-diagnostics
          path: |
            JENESIS/release/**/builder-debug.yml
            ${{ env.APPDATA }}/JENESIS/logs/
          if-no-files-found: warn

      # A failing job publishes its transcript as a commit on this branch so the
      # failure can be diagnosed even when log archives cannot be downloaded.
      # Delete the ci-logs folder once the failure is understood; a green run
      # does not create it.
      - name: Commit smoke-test diagnostics to the branch
        if: failure()
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p ci-logs
          if [ -d "$APPDATA/JENESIS/logs" ]; then cp -r "$APPDATA/JENESIS/logs/." ci-logs/ || true; fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A ci-logs
          if git diff --cached --quiet; then echo "no diagnostics to commit"; else
            git commit -m "ci: Windows smoke-test diagnostics for run ${{ github.run_id }}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
