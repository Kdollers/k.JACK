name: Windows installer

permissions:
  contents: write   # the failure step commits diagnostic logs to ci-logs/ on this branch

on:
  workflow_dispatch:
  push:
    branches: [ "arena/**" ]
    paths: [ "genesis/**", ".github/workflows/windows-installer.yml" ]

jobs:
  build-and-test:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: genesis
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: pwsh
        run: |
          cmd /c "npm ci --foreground-scripts --loglevel=http > npm-ci.log 2>&1"
          $code = $LASTEXITCODE
          Get-Content npm-ci.log -Tail 300
          if ($code -ne 0) { exit $code }

      - name: Publish diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          # Artifact and log downloads are not reachable from every network, so the
          # failing job commits its tail of logs to ci-logs/ on the same branch.
          New-Item -ItemType Directory -Force -Path ../ci-logs | Out-Null
          $tail = @()
          if (Test-Path npm-ci.log) { $tail = Get-Content npm-ci.log -Tail 400 }
          $tail | Set-Content -Path ../ci-logs/npm-ci-failure.log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f ../ci-logs/npm-ci-failure.log
          git commit -m "CI diagnostics: npm ci failure log" | Out-Null
          git pull --rebase origin $env:GITHUB_REF_NAME | Out-Null
          git push origin HEAD:$env:GITHUB_REF_NAME

      - name: Run automated tests
        run: npm run test:all

      - name: Build the Windows installer
        run: npm run desktop:dist

      - name: Verify package contents
        run: node scripts/verify-package.cjs release/win-unpacked

      - name: Install, launch and test the installed application
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter 'GENESIS-Setup-*.exe' | Select-Object -First 1
          ./scripts/smoke-test-installed.ps1 -InstallerPath $installer.FullName

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: GENESIS-Windows-installer
          path: genesis/release/GENESIS-Setup-*.exe
          if-no-files-found: error
